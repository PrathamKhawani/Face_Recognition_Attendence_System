<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceID Attendance Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header>
            <div class="logo-area">
                <div class="icon-pulse"></div>
                <h1>FaceID Attendance</h1>
            </div>
            <div class="status-bar">
                <span class="status-dot"></span>
                <span id="current-time">00:00:00</span>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Video Section -->
            <section class="video-card card">
                <div class="card-header">
                    <h2>Live Monitoring</h2>
                    <button class="btn-refresh" onclick="reloadFaces()" title="Reload Encodings">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    </button>
                </div>
                <div class="video-wrapper">
                    <img id="video-stream" src="{{ url_for('video_feed') }}" alt="Webcam Feed" onerror="if(typeof setupClientCameraFallback === 'function') setupClientCameraFallback('video-stream', 'entry')">
                    <div class="scanner-line"></div>
                </div>
            </section>

            <!-- Logs Section -->
            <section class="logs-card card">
                <div class="card-header">
                    <h2>Attendance Log</h2>
                    <span class="badge" id="attendance-count">0 Present Today</span>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-body">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    <div id="toast-container"></div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function fetchAttendance() {
            try {
                const response = await fetch('/attendance_data');
                const data = await response.json();
                const body = document.getElementById('attendance-body');
                const countBadge = document.getElementById('attendance-count');
                
                countBadge.textContent = `${data.length} Present Today`;
                
                body.innerHTML = data.map(row => `
                    <tr class="row-fade-in">
                        <td>
                            <div class="name-cell">
                                <div class="avatar">${row.Name.charAt(0)}</div>
                                <span>${row.Name}</span>
                            </div>
                        </td>
                        <td>${row.Time}</td>
                        <td><span class="status-pill">Present</span></td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error("Error fetching attendance:", error);
            }
        }

        async function reloadFaces() {
            const btn = document.querySelector('.btn-refresh');
            btn.classList.add('spinning');
            try {
                await fetch('/reload_faces');
                alert("Faces reloaded successfully!");
            } finally {
                btn.classList.remove('spinning');
            }
        }

        setInterval(fetchAttendance, 3000);
        fetchAttendance();
    </script>
</body>
</html>
